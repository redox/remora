name: Remora
options:
  bundleIdPrefix: dev.remora
  deploymentTarget:
    macOS: "26.0"
configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: $(REMORA_CODE_SIGN_IDENTITY)
    DEVELOPMENT_TEAM: $(REMORA_DEVELOPMENT_TEAM)
  configs:
    Release:
      ARCHS: "arm64 x86_64"
      ONLY_ACTIVE_ARCH: NO
      CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
packages:
  RemoraKit:
    path: Packages/RemoraKit
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.1
targets:
  Remora:
    type: application
    platform: macOS
    sources:
      - App/Remora
      # Bundled so the license notices ship with the binary (Settings › General › Acknowledgements).
      - path: LICENSE
        buildPhase: resources
      - path: THIRD-PARTY-NOTICES.md
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.remora.Remora
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: App/Remora/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/Remora/Remora.entitlements
    dependencies:
      - package: RemoraKit
        product: Storage
      - package: RemoraKit
        product: Redaction
      - package: RemoraKit
        product: Capture
      - package: RemoraKit
        product: Indicator
      - package: RemoraKit
        product: MCPServer
      - package: RemoraKit
        product: MeetingImport
      - package: RemoraKit
        product: LLM
      - package: RemoraKit
        product: Retrieval
      - package: RemoraKit
        product: Rewrite
      - package: RemoraKit
        product: Input
      - package: RemoraKit
        product: Dictation
      - package: RemoraKit
        product: Memory
      - package: RemoraKit
        product: Embeddings
      - package: RemoraKit
        product: Lifecycle
      - package: RemoraKit
        product: Assistant
      - package: RemoraKit
        product: ChatBar
      - package: RemoraKit
        product: ClientConfig
      # Not `embed: true`: XcodeGen then copies a nonexistent "Sparkle-product"; Xcode embeds the
      # package's binary Sparkle.framework on its own (checked: Contents/Frameworks/Sparkle.framework).
      - package: Sparkle
      - target: remora-mcp
        embed: true
        copy:
          destination: executables
  remora-mcp:
    type: tool
    platform: macOS
    sources: [App/remora-mcp]
    settings:
      base:
        PRODUCT_NAME: remora-mcp
        PRODUCT_BUNDLE_IDENTIFIER: dev.remora.remora-mcp
    dependencies:
      - package: RemoraKit
        product: MCPServer
      - package: RemoraKit
        product: Retrieval
      - package: RemoraKit
        product: Embeddings
