<!doctype html>
<html lang="en" data-root="@ROOT@">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="@DESCRIPTION@">
  <meta name="theme-color" content="#fcfcfa" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#181c1d" media="(prefers-color-scheme: dark)">
  <title>@TITLE@</title>
  <link rel="icon" type="image/png" sizes="16x16" href="@ROOT@assets/favicon-16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="@ROOT@assets/favicon.png">
  <link rel="stylesheet" href="@ROOT@assets/site.css">
  <script src="@ROOT@assets/site.js" defer></script>
</head>
<body class="@KIND@">
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="@HOME@" @HOME_CURRENT@>
        <img src="@ROOT@assets/remora.png" alt="" width="30" height="30"> Remora
      </a>
      <nav class="top-nav" aria-label="Main navigation">
        <a href="@ROOT@docs/" @DOCS_CURRENT@>Docs</a>
        <a href="@ROOT@docs/privacy/">Privacy</a>
        @GITHUB@
      </nav>
      <button class="search-trigger" type="button" aria-haspopup="dialog" hidden>
        <span class="search-icon" aria-hidden="true"></span><span class="search-label">Search docs</span><kbd class="search-keys" aria-hidden="true">⌘ K</kbd>
      </button>
      <a class="button header-install" href="@DOWNLOAD@">Get Remora</a>
    </div>
  </header>
  @CONTENT@
  <footer class="site-footer">
    <div class="footer-inner">
      <a class="brand" href="@HOME@"><img src="@ROOT@assets/remora.png" alt="" width="28" height="28"> Remora</a>
      <nav aria-label="Footer navigation">
        <a href="@ROOT@docs/">Documentation</a>
        <a href="@ROOT@docs/privacy/">Privacy</a>
        @GITHUB@
      </nav>
      <p>Open source under the MIT License.</p>
    </div>
  </footer>
  <dialog class="search-dialog" aria-labelledby="search-title">
    <form class="search-form" role="search">
      <label id="search-title" for="search-input">Search documentation</label>
      <div class="search-row">
        <span class="search-icon" aria-hidden="true"></span>
        <input id="search-input" type="search" placeholder="Try “dictation” or “exclusions”" autocomplete="off">
        <button type="button" class="search-close">Close</button>
      </div>
    </form>
    <p class="search-status" role="status"></p>
    <ul class="search-results"></ul>
  </dialog>
</body>
</html>
