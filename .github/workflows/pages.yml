name: Website

on:
  pull_request:
    paths:
      - '.github/workflows/pages.yml'
      - 'docs/site/**'
      - 'App/Remora/Assets.xcassets/AppIcon.appiconset/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/pages.yml'
      - 'docs/site/**'
      - 'App/Remora/Assets.xcassets/AppIcon.appiconset/**'
  release:
    types: [published, edited, unpublished, deleted]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.event_name == 'release' && 'release' || github.event.pull_request.number || 'publish' }}
  cancel-in-progress: false

jobs:
  refresh-on-release:
    # Pages accepts deployments from main, while release events run on the tag ref.
    if: github.event_name == 'release' && github.event.repository.has_pages
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Run the website workflow on the default branch
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_BRANCH: ${{ github.event.repository.default_branch }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref "$DEPLOY_BRANCH"

  build:
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/site/search/package-lock.json
      - name: Build and check internal links
        env:
          REMORA_SITE_REPOSITORY: ${{ github.server_url }}/${{ github.repository }}
          REMORA_SITE_GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF" = 'refs/heads/main' ]; then
            python3 docs/site/build.py
          else
            python3 docs/site/build.py --download-url ''
          fi
      - name: Upload website
        if: github.ref == 'refs/heads/main' && github.event.repository.has_pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event.repository.has_pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
