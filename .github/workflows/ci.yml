name: CI

on:
  push:
    branches: [main]
  pull_request: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Select the newest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)" && xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Self-test the public-data check
        run: scripts/check-public.sh --selftest
      - name: Check for personal data and secrets
        run: scripts/check-public.sh
      - name: Unit tests
        run: make test
      - name: Build (unsigned Debug)
        run: make ci-build
