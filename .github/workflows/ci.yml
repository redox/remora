name: CI

on:
  push:
    branches: [main]
  pull_request: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Check Xcode version
        run: xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Self-test the public-data check
        run: scripts/check-public.sh --selftest
      - name: Check for personal data and secrets
        run: scripts/check-public.sh
      - name: Test GitHub release checks
        run: PYTHONDONTWRITEBYTECODE=1 python3 scripts/test_github_release.py
      - name: Unit tests
        # Run Swift Testing serially so elapsed-time assertions have runner capacity.
        run: make test SWIFT_TEST_FLAGS=--no-parallel
      - name: Build (unsigned Debug)
        run: make ci-build
